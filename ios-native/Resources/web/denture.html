<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="diag" style="position:fixed;left:8px;bottom:6px;color:#d9a;font:13px/1.5 -apple-system,sans-serif;pointer-events:none">HTML OK, módulo pendiente…</div>
<script>
window.addEventListener('error',function(e){var d=document.getElementById('diag');if(d)d.textContent='error: '+(e.message||e.type)+' @'+(e.filename||'').split('/').pop()+':'+e.lineno;});
window.addEventListener('unhandledrejection',function(e){var d=document.getElementById('diag');if(d)d.textContent='promesa: '+(e.reason&&e.reason.message||e.reason);});
</script>
<script type="module">
import * as D from './assets/denture.js';
const cv = document.getElementById('c');
let mounted = false;
/* Cola serializada: la ÚLTIMA llamada siempre gana. Sin esto, una llamada que
   llega mientras otra aún carga el GLB recibe la instancia cacheada de la
   anterior (mountLive la guarda por canvas) y los colores pedidos se pierden:
   los dientes se quedan blancos aunque haya zonas mal cepilladas. */
let pending = null;
let busy = false;
window.setZones = async function(classes){
  pending = classes;
  if (busy) return;
  busy = true;
  while (pending !== null) {
    const cls = pending; pending = null;
    try{
      if (mounted) { D.disposeAll(); mounted = false; }
      await D.mountLive(cv, cls);
      mounted = true;
      var d = document.getElementById('diag'); if (d) d.remove();
    }catch(e){ console.error('setZones', e); }
  }
  busy = false;
};
window.setZones(['none','none','none','none','none','none','none','none']);
</script></body></html>
