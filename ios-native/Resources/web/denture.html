<!doctype html><html data-shell="native"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
#diag{position:fixed;left:6px;top:4px;color:rgba(255,255,255,.45);font:9px -apple-system,sans-serif;pointer-events:none;z-index:9}
</style></head><body>
<canvas id="c"></canvas>
<div id="diag"></div>
<script>
/* Cola en script CLÁSICO (síncrono): window.setZones existe desde el primer
   parseo, así que las llamadas de SwiftUI por evaluateJavaScript no se pierden
   nunca, lleguen antes o después de que cargue el módulo. La última gana. */
window.__zq = [];
window.setZones = function(c){ window.__zq.push(c); };
</script>
<script type="module">
import * as D from './assets/denture.js';
const cv = document.getElementById('c');
const diag = document.getElementById('diag');
const DIAG = new URLSearchParams(location.search).has('diag');
let mounted = false, api = null, busy = false;
/* Los gestos los conduce SwiftUI por evaluateJavaScript */
window.dragRot = function(dx, dy){ if (api && api.rot) api.rot(dx, dy); };
window.pinchZoom = function(f){ if (api && api.zoomBy) api.zoomBy(f); };
window.resetRot = function(){ if (api && api.resetRot) api.resetRot(); };
function report(cls){
  if (DIAG) { try { diag.textContent = 'z:' + cls.join(',') + ' wk:' + ((window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.zones) ? 'si' : 'no'); } catch(e) {} }
  try { fetch('./__zones/' + cls.join('-')).catch(function(){}); } catch(e) {}
  try { window.webkit.messageHandlers.zones.postMessage(cls.join(',')); } catch(e) {}
}
window.addEventListener('error', function(e){ if (DIAG) diag.textContent = 'error: ' + (e.message || e.type); });
/* Montaje inicial de cortesía: algo visible aunque SwiftUI no llame */
window.setZones(['none','none','none','none','none','none','none','none']);
setInterval(async function(){
  if (busy || !window.__zq.length) return;
  busy = true;
  const cls = window.__zq[window.__zq.length - 1]; window.__zq.length = 0;
  try {
    if (mounted && api && api.recolor) {
      api.recolor(cls); // recolorear en caliente: sin desmontar, sin perder gestos
    } else {
      api = await D.mountLive(cv, cls);
      if (api && api.disablePointerDrag) api.disablePointerDrag();
      mounted = true;
    }
    report(cls);
  } catch(e) { if (DIAG) { try { diag.textContent = 'err:' + (e && e.message || e); } catch(e2) {} } }
  busy = false;
}, 60);
</script></body></html>
