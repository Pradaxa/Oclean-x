<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="diag" style="position:fixed;left:8px;bottom:6px;color:#a88;font:11px/1.5 -apple-system,sans-serif;pointer-events:none">cargando 3D…</div>
<script>
window.addEventListener('error',function(e){var d=document.getElementById('diag');if(d)d.textContent='error: '+(e.message||e.type)+' @'+(e.filename||'').split('/').pop()+':'+e.lineno;});
window.addEventListener('unhandledrejection',function(e){var d=document.getElementById('diag');if(d)d.textContent='promesa: '+(e.reason&&e.reason.message||e.reason);});
</script>
<script type="module">
import * as D from './assets/denture.js';
const cv = document.getElementById('c');
let mounted = false;
window.setZones = async function(classes){
  try{
    if(mounted){ D.disposeAll(); mounted = false; }
    await D.mountLive(cv, classes);
    mounted = true;
  }catch(e){ console.error('setZones', e); }
};
window.setZones(['none','none','none','none','none','none','none','none']).then(function(){
  var d=document.getElementById('diag');
  if(d && d.textContent==='cargando 3D…') d.remove();
});
</script></body></html>
