name: OcleanXNative
options:
  bundleIdPrefix: com.pradaxa
  deploymentTarget:
    iOS: "15.0"
targets:
  OcleanX:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources/web
        type: folder
      - path: Resources/Assets.xcassets
        optional: true
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Oclean X
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: Oclean X usa Bluetooth para conectar con tu cepillo y sincronizar tus cepillados.
        # Sin modo de compatibilidad: si el sistema ofrece el diseño del SO (Liquid Glass en iOS 26), úsalo.
        UIDesignRequiresCompatibility: false
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pradaxa.ocleanx
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
  OcleanXUITests:
    type: ui-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: UITests
    dependencies:
      - target: OcleanX
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: OcleanX

schemes:
  OcleanX:
    build:
      targets:
        OcleanX: all
        OcleanXUITests: [test]
    test:
      targets:
        - OcleanXUITests
